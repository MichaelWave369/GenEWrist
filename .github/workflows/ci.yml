name: GenEWrist verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Verify static output
        run: |
          test -f dist/index.html
          test -f dist/style.css
          test -f dist/src/main.js
          test -f dist/src/xr.js
