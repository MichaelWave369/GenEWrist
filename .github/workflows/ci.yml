name: GenEWrist verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify:static
      - run: npm run verify:offline
      - run: npm run build:sdk
      - run: npm run verify:sdk
      - name: Install Chromium browser-test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genewrist-browser-evidence
          path: browser-evidence/
          if-no-files-found: ignore
      - name: Upload pinned SDK candidate
        uses: actions/upload-artifact@v4
        with:
          name: genewrist-sdk-0.3.0
          path: |
            sdk-dist/genewrist-0.3.0.tgz
            sdk-dist/SHA256SUMS
